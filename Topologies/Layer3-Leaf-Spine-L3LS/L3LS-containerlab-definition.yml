name: ks-l3ls-fabric
topology:
  kinds:
    ceos:
      startup-config: ./ceos_lab_template/ceos.cfg.tpl
      image: ceoslab:4.31.2F
      exec:
        - sleep 10
        - FastCli -p 15 -c 'security pki key generate rsa 4096 eAPI.key'
        - FastCli -p 15 -c 'security pki certificate generate self-signed eAPI.crt key eAPI.key generate rsa 4096 validity 30000 parameters common-name eAPI'
      binds:
      - ./sn/token:/mnt/flash/token:ro
    linux:
      image: alpine
  defaults:
    kind: ceos


  nodes:
    ks-l3ls-spine1:
        binds:
          - ./sn/ks-l3ls-spine1.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.11
    ks-l3ls-spine2:
        binds:
          - ./sn/ks-l3ls-spine2.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.12
    ks-l3ls-spine3:
        binds:
          - ./sn/ks-l3ls-spine3.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.13
    ks-l3ls-spine4:
        binds:
          - ./sn/ks-l3ls-spine4.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.14
    ks-l3ls-leaf1:
        binds:
          - ./sn/ks-l3ls-leaf1.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.15
    ks-l3ls-leaf2:
        binds:
          - ./sn/ks-l3ls-leaf2.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.16
    ks-l3ls-leaf3:
        binds:
          - ./sn/ks-l3ls-leaf3.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.17
    ks-l3ls-leaf4:
        binds:
          - ./sn/ks-l3ls-leaf4.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.18
    ks-l3ls-leaf5:
        binds:
          - ./sn/ks-l3ls-leaf5.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.19
    ks-l3ls-leaf6:
        binds:
          - ./sn/ks-l3ls-leaf6.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.20
    ks-l3ls-host1:
        binds:
          - ./sn/ks-l3ls-host1.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.21
    ks-l3ls-host2:
        binds:
          - ./sn/ks-l3ls-host2.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.22
    ks-l3ls-host3:
        binds:
          - ./sn/ks-l3ls-host3.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.23
    ks-l3ls-host4:
        binds:
          - ./sn/ks-l3ls-host4.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.110.110.24


  links:

  ##############################
  # ks-l3ls-spine1 to ks-l3ls-leafs
  ##############################

    - endpoints:
      - ks-l3ls-spine1:eth3
      - ks-l3ls-leaf1:eth3
    - endpoints:
      - ks-l3ls-spine1:eth4
      - ks-l3ls-leaf2:eth3
    - endpoints:
      - ks-l3ls-spine1:eth5
      - ks-l3ls-leaf3:eth3
    - endpoints:
      - ks-l3ls-spine1:eth6
      - ks-l3ls-leaf4:eth3
    - endpoints:
      - ks-l3ls-spine1:eth7
      - ks-l3ls-leaf5:eth3
    - endpoints:
      - ks-l3ls-spine1:eth8
      - ks-l3ls-leaf6:eth3

  ##############################
  # ks-l3ls-spine2 to ks-l3ls-leafs
  ##############################

    - endpoints:
      - ks-l3ls-spine2:eth3
      - ks-l3ls-leaf1:eth4
    - endpoints:
      - ks-l3ls-spine2:eth4
      - ks-l3ls-leaf2:eth4
    - endpoints:
      - ks-l3ls-spine2:eth5
      - ks-l3ls-leaf3:eth4
    - endpoints:
      - ks-l3ls-spine2:eth6
      - ks-l3ls-leaf4:eth4
    - endpoints:
      - ks-l3ls-spine2:eth7
      - ks-l3ls-leaf5:eth4
    - endpoints:
      - ks-l3ls-spine2:eth8
      - ks-l3ls-leaf6:eth4

  ##############################
  # ks-l3ls-spine3 to ks-l3ls-leafs
  ##############################

    - endpoints:
      - ks-l3ls-spine3:eth3
      - ks-l3ls-leaf1:eth5
    - endpoints:
      - ks-l3ls-spine3:eth4
      - ks-l3ls-leaf2:eth5
    - endpoints:
      - ks-l3ls-spine3:eth5
      - ks-l3ls-leaf3:eth5
    - endpoints:
      - ks-l3ls-spine3:eth6
      - ks-l3ls-leaf4:eth5
    - endpoints:
      - ks-l3ls-spine3:eth7
      - ks-l3ls-leaf5:eth5
    - endpoints:
      - ks-l3ls-spine3:eth8
      - ks-l3ls-leaf6:eth5

  ##############################
  # ks-l3ls-spine4 to ks-l3ls-leafs
  ##############################

    - endpoints:
      - ks-l3ls-spine4:eth3
      - ks-l3ls-leaf1:eth6
    - endpoints:
      - ks-l3ls-spine4:eth4
      - ks-l3ls-leaf2:eth6
    - endpoints:
      - ks-l3ls-spine4:eth5
      - ks-l3ls-leaf3:eth6
    - endpoints:
      - ks-l3ls-spine4:eth6
      - ks-l3ls-leaf4:eth6
    - endpoints:
      - ks-l3ls-spine4:eth7
      - ks-l3ls-leaf5:eth6
    - endpoints:
      - ks-l3ls-spine4:eth8
      - ks-l3ls-leaf6:eth6

  ##############################
  # ks-l3ls-leaf1 to ks-l3ls-leaf2
  ##############################

    - endpoints:
      - ks-l3ls-leaf1:eth47
      - ks-l3ls-leaf2:eth47
    - endpoints:
      - ks-l3ls-leaf1:eth48
      - ks-l3ls-leaf2:eth48

  ##############################
  # ks-l3ls-leaf3 to ks-l3ls-leaf4
  ##############################

    - endpoints:
      - ks-l3ls-leaf3:eth47
      - ks-l3ls-leaf4:eth47
    - endpoints:
      - ks-l3ls-leaf3:eth48
      - ks-l3ls-leaf4:eth48

  ##############################
  # ks-l3ls-leaf5 to ks-l3ls-leaf6
  ##############################

    - endpoints:
      - ks-l3ls-leaf5:eth47
      - ks-l3ls-leaf6:eth47
    - endpoints:
      - ks-l3ls-leaf5:eth48
      - ks-l3ls-leaf6:eth48

  ##############################
  # ks-l3ls-leafs to ks-l3ls-hosts
  ##############################

    - endpoints:
      - ks-l3ls-leaf1:eth7
      - ks-l3ls-host1:eth1
    - endpoints:
      - ks-l3ls-leaf2:eth7
      - ks-l3ls-host1:eth2
    - endpoints:
      - ks-l3ls-leaf3:eth7
      - ks-l3ls-host2:eth1
    - endpoints:
      - ks-l3ls-leaf4:eth7
      - ks-l3ls-host2:eth2
    - endpoints:
      - ks-l3ls-leaf3:eth8
      - ks-l3ls-host3:eth1
    - endpoints:
      - ks-l3ls-leaf4:eth8
      - ks-l3ls-host3:eth2
    - endpoints:
      - ks-l3ls-leaf5:eth7
      - ks-l3ls-host4:eth1
    - endpoints:
      - ks-l3ls-leaf6:eth7
      - ks-l3ls-host4:eth2

mgmt:
  network: ceos_clab_ks_l3ls
  ipv4-subnet: 172.110.110.0/24
  ipv6-subnet: 2001:172:110:110::/80
