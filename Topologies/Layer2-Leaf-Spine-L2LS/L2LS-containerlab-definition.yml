name: ks-l2ls-fabric
topology:
  kinds:
    ceos:
      startup-config: ./ceos_lab_template/ceos.cfg.tpl
      image: ceoslab:4.31.2F
      exec:
        - sleep 10
        - FastCli -p 15 -c 'security pki key generate rsa 4096 eAPI.key'
        - FastCli -p 15 -c 'security pki certificate generate self-signed eAPI.crt key eAPI.key generate rsa 4096 validity 30000 parameters common-name eAPI'
      binds:
      - ./sn/token:/mnt/flash/token:ro
    linux:
      image: alpine
  defaults:
    kind: ceos


  nodes:
    ks-l3device:
        binds:
          - ./sn/ks-l3device.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.100.100.11
    ks-spine1:
        binds:
          - ./sn/ks-spine1.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.100.100.12
    ks-spine2:
        binds:
          - ./sn/ks-spine2.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.100.100.13
    ks-leaf1:
        binds:
          - ./sn/ks-leaf1.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.100.100.14
    ks-leaf2:
        binds:
          - ./sn/ks-leaf2.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.100.100.15
    ks-leaf3:
        binds:
          - ./sn/ks-leaf3.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.100.100.16
    ks-leaf4:
        binds:
          - ./sn/ks-leaf4.txt:/mnt/flash/ceos-config:ro
          - ./sn/token:/mnt/flash/token:ro
        mgmt-ipv4: 172.100.100.17
    ks-host1:
        kind: linux
        mgmt-ipv4: 172.100.100.19
        env:
          TMODE: lacp
    ks-host2:
        kind: linux
        mgmt-ipv4: 172.100.100.20
        env:
          TMODE: lacp
    ks-host3:
        kind: linux
        mgmt-ipv4: 172.100.100.21
        env:
          TMODE: lacp
    ks-host4:
        kind: linux
        mgmt-ipv4: 172.100.100.22
        env:
          TMODE: lacp


  links:

  ##############################
  # L3_Device to ks-spines
  ##############################

    - endpoints:
      - ks-l3device:eth1
      - ks-spine1:eth5
    - endpoints:
      - ks-l3device:eth2
      - ks-spine2:eth5

  ##############################
  # ks-spine to ks-spine
  ##############################

    - endpoints:
      - ks-spine1:eth47
      - ks-spine2:eth47
    - endpoints:
      - ks-spine1:eth48
      - ks-spine2:eth48

  ##############################
  # ks-spine1 to ks-leafs
  ##############################

    - endpoints:
      - ks-spine1:eth1
      - ks-leaf1:eth1
    - endpoints:
      - ks-spine1:eth2
      - ks-leaf2:eth1
    - endpoints:
      - ks-spine1:eth3
      - ks-leaf3:eth1
    - endpoints:
      - ks-spine1:eth4
      - ks-leaf4:eth1

  ##############################
  # ks-spine2 to ks-leafs
  ##############################

    - endpoints:
      - ks-spine2:eth1
      - ks-leaf1:eth2
    - endpoints:
      - ks-spine2:eth2
      - ks-leaf2:eth2
    - endpoints:
      - ks-spine2:eth3
      - ks-leaf3:eth2
    - endpoints:
      - ks-spine2:eth4
      - ks-leaf4:eth2

  ##############################
  # ks-leaf1 to ks-leaf2
  ##############################

    - endpoints:
      - ks-leaf1:eth47
      - ks-leaf2:eth47
    - endpoints:
      - ks-leaf1:eth48
      - ks-leaf2:eth48

  ##############################
  # ks-leaf3 to ks-leaf4
  ##############################

    - endpoints:
      - ks-leaf3:eth47
      - ks-leaf4:eth47
    - endpoints:
      - ks-leaf3:eth48
      - ks-leaf4:eth48

  ##############################
  # ks-leafs to ks-hosts
  ##############################

    - endpoints:
      - ks-leaf1:eth3
      - ks-host1:eth3
    - endpoints:
      - ks-leaf2:eth3
      - ks-host2:eth3
    - endpoints:
      - ks-leaf3:eth3
      - ks-host3:eth3
    - endpoints:
      - ks-leaf4:eth3
      - ks-host4:eth3

mgmt:
  network: ceos_clab_ks
  ipv4-subnet: 172.100.100.0/24
  ipv6-subnet: 2001:172:100:100::/80
